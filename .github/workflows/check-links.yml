# Checks every link in README.md once a month and opens an issue if any are broken.
# Run it by hand from the Actions tab with "Run workflow".
name: Check links

on:
  schedule:
    - cron: "0 15 1 * *" # 15:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Many publisher sites (ACM, IEEE, Medium, Unreal) block automated checks with 403 or 429.
      # Those codes are accepted so they don't flood the report; real dead links (404, 410, DNS errors) still fail.
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept "200..=299,403,429"
            README.md
          fail: false

      - name: Open an issue listing broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found by the monthly check
          content-filepath: ./lychee/out.md
          labels: broken-link
